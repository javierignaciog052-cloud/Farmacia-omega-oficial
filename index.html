      <div class="flex items-center gap-2 flex-wrap">
        <span class="bg-slate-950 text-amber-400 text-[11px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-unlock-keyhole"></i> Modo Editor

        <span id="cloudStatusBadge" onclick="window.openSettingsModal()" class="cursor-pointer bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-2xs">

      <div class="flex items-center gap-2 flex-wrap">

          <i class="fa-solid fa-plus text-brand-cyan"></i> Nuevo Producto

        <button type="button" onclick="window.openSettingsModal()" class="bg-white hover:bg-slate-100 text-slate-900 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition shadow-xs cursor-pointer">
          <i class="fa-solid fa-gear"></i> Configurar Tienda

        <button type="button" onclick="window.logoutAdmin()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition cursor-pointer">
          <i class="fa-solid fa-right-from-bracket"></i> Salir
        </button>
      </div>
    </div>
